name: Mobile verification
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm test && npm run build && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/offrally-build CODE_SIGNING_ALLOWED=NO build
      - name: Compile Screen Time enforcement for a physical device
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath /tmp/offrally-build CODE_SIGNING_ALLOWED=NO build
      - name: Launch the built app on an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" /tmp/offrally-build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" app.offrally.club
          sleep 5
          xcrun simctl io "$device" screenshot Offrally-iPhone.png
      - uses: actions/upload-artifact@v4
        with: {name: Offrally-iPhone-Screenshot, path: Offrally-iPhone.png}
      - run: ditto -c -k --keepParent /tmp/offrally-build/Build/Products/Debug-iphonesimulator/App.app Offrally-simulator.zip
      - uses: actions/upload-artifact@v4
        with: {name: Offrally-iOS-Simulator, path: Offrally-simulator.zip}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm ci && npm test && npm run build && npx cap sync android
      - run: cd android && ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with: {name: Offrally-Android, path: android/app/build/outputs/apk/debug/app-debug.apk}
      - uses: actions/upload-artifact@v4
        with: {name: Offrally-Android-Unsigned-Bundle, path: android/app/build/outputs/bundle/release/app-release.aab}
